<text x="180" y="3330" font-size="25" fill="#6E7C80">LINGJING · 广东古镇沉浸式导览系统 ｜ A3 横版学习示意 ｜ 姓名：__________  准考证号：__________</text><rect x="180" y="590" width="1030" height="350" rx="28" fill="#fff" stroke="#BFC9C5" stroke-width="5"/><rect x="180" y="590" width="14" height="350" rx="7" fill="#D65245"/><text x="228" y="655" class="" text-anchor="start" font-size="42" font-weight="700" fill="#17232A">命题关键词</text><text x="228" y="715" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">广东古镇遗址展览馆</text><text x="228" y="759" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">VR/AR 眼镜创新｜展览活动｜商业可行性</text><text x="228" y="803" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">外观结构｜UI 流程｜情景使用｜工作原理</text><rect x="180" y="990" width="1030" height="570" rx="28" fill="#fff" stroke="#BFC9C5" stroke-width="5"/><rect x="180" y="990" width="14" height="570" rx="7" fill="#087E7B"/><text x="228" y="1055" class="" text-anchor="start" font-size="42" font-weight="700" fill="#17232A">用户与痛点</text><text x="228" y="1115" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">年轻游客：内容碎片化，缺少分享动力</text><text x="228" y="1159" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">亲子家庭：展板难懂，互动不足</text><text x="228" y="1203" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">展馆运营：客流分散，设备卫生与复购压力</text><text x="228" y="1247" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">关键洞察：传统封闭 VR 不能安全地“边走边看”</text><rect x="180" y="1610" width="1030" height="550" rx="28" fill="#fff" stroke="#BFC9C5" stroke-width="5"/><rect x="180" y="1610" width="14" height="550" rx="7" fill="#D9A441"/><text x="228" y="1675" class="" text-anchor="start" font-size="42" font-weight="700" fill="#17232A">设计目标</text><text x="228" y="1735" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">开放导览：看得见真实展厅与同行者</text><text x="228" y="1779" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">沉浸复原：在遗址节点进入历史场景</text><text x="228" y="1823" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">共享运营：快速消毒、模块维护、内容可更新</text><text x="228" y="1867" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">文化转译：建筑、声景、人物故事形成任务线</text><circle cx="1780" cy="1030" r="270" fill="#E0F1EC" stroke="#087E7B" stroke-width="12"/><text x="1780" y="970" class="" text-anchor="middle" font-size="52" font-weight="800" fill="#17232A">核心策略</text><text x="1780" y="1040" class="" text-anchor="middle" font-size="72" font-weight="800" fill="#087E7B">双态切换</text><text x="1780" y="1100" class="" text-anchor="middle" font-size="30" font-weight="500" fill="#6E7C80">开放导览 × 沉浸复原</text><circle cx="1450" cy="1510" r="155" fill="#fff" stroke="#087E7B" stroke-width="10"/><text x="1450" y="1500" class="" text-anchor="middle" font-size="33" font-weight="800" fill="#17232A">① 到馆领用</text><text x="1450" y="1556" class="" text-anchor="middle" font-size="25" font-weight="400" fill="#6E7C80">票务绑定 / 选择路线</text><circle cx="2000" cy="1510" r="155" fill="#fff" stroke="#087E7B" stroke-width="10"/><text x="2000" y="1500" class="" text-anchor="middle" font-size="33" font-weight="800" fill="#17232A">② 识别遗址</text><text x="2000" y="1556" class="" text-anchor="middle" font-size="25" font-weight="400" fill="#6E7C80">空间定位 / AR 导航</text><circle cx="2550" cy="1510" r="155" fill="#fff" stroke="#087E7B" stroke-width="10"/><text x="2550" y="1500" class="" text-anchor="middle" font-size="33" font-weight="800" fill="#17232A">③ 历史复原</text><text x="2550" y="1556" class="" text-anchor="middle" font-size="25" font-weight="400" fill="#6E7C80">翻下遮光镜片 / 进入场景</text><circle cx="3100" cy="1510" r="155" fill="#fff" stroke="#087E7B" stroke-width="10"/><text x="3100" y="1500" class="" text-anchor="middle" font-size="33" font-weight="800" fill="#17232A">④ 完成任务</text><text x="3100" y="1556" class="" text-anchor="middle" font-size="25" font-weight="400" fill="#6E7C80">获得数字印章 / 生成纪念</text><path d="M1610,1510 L1820,1510" stroke="#087E7B" stroke-width="10" fill="none" marker-end="url(#arrow)"/><path d="M2160,1510 L2370,1510" stroke="#087E7B" stroke-width="10" fill="none" marker-end="url(#arrow)"/><path d="M2710,1510 L2920,1510" stroke="#087E7B" stroke-width="10" fill="none" marker-end="url(#arrow)"/><rect x="1370" y="1890" width="1330" height="680" rx="28" fill="#fff" stroke="#BFC9C5" stroke-width="5"/><rect x="1370" y="1890" width="14" height="680" rx="7" fill="#087E7B"/><text x="1418" y="1955" class="" text-anchor="start" font-size="42" font-weight="700" fill="#17232A">体验闭环：用户动作 → 产品反馈</text><text x="1418" y="2015" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">01 凝视 / 手势框选展品 → 弹出构件信息</text><text x="1418" y="2059" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">02 翻转镜片 → 古镇建筑与生活场景 1:1 复原</text><text x="1418" y="2103" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">03 耳挂定向声场 → 听见粤语市集、非遗工艺声</text><text x="1418" y="2147" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">04 完成任务 → 数字纪念卡 + 文创兑换券</text><rect x="2780" y="1890" width="1980" height="680" rx="28" fill="#fff" stroke="#BFC9C5" stroke-width="5"/><rect x="2780" y="1890" width="14" height="680" rx="7" fill="#D65245"/><text x="2828" y="1955" class="" text-anchor="start" font-size="42" font-weight="700" fill="#17232A">商业闭环：一次设备，多次内容运营</text><text x="2828" y="2015" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">B 端：展馆采购 + 内容年度订阅 + 设备维护服务</text><text x="2828" y="2059" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">C 端：门票联动 / 限时租赁 / 夜游专题 / 研学套装</text><text x="2828" y="2103" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">传播：AI 生成“我的古镇漫游卡” → 社交分享 → 再访</text><text x="2828" y="2147" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">数据：热点展项、路线停留、设备状态 → 后台优化</text><text x="2828" y="2191" class="" text-anchor="start" font-size="30" font-weight="400" fill="#6E7C80">可复制：硬件平台不变，替换不同古镇的数字内容包</text><text x="4100" y="970" class="" text-anchor="start" font-size="36" font-weight="800" fill="#17232A">评分抓手</text><text x="4100" y="1030" class="" text-anchor="start" font-size="45" font-weight="800" fill="#087E7B">产品 40%</text><text x="4100" y="1100" class="" text-anchor="start" font-size="45" font-weight="800" fill="#D65245">系统 40%</text><text x="4100" y="1170" class="" text-anchor="start" font-size="32" font-weight="600" fill="#6E7C80">原理 10% · 完成度 10%</text>
